services:
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: painel-backend
    ports:
      - "5080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: ${ConnectionStrings__Postgres}
      Cors__AllowedOrigins: ${Cors__AllowedOrigins:-http://localhost:5173}
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5080/api}
    container_name: painel-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
